name: test_app
description: A simple Flutter frontend for image or file picking
publish_to: "none"

# Flutter SDK version constraints
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🌐 Flutter Web Plugins
  flutter_web_plugins:
    sdk: flutter

  # 🧱 Firebase Core Packages
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.4.10

  # 🧩 UI & Utilities
  file_picker: ^8.0.0           # For picking images/files
  auto_size_text: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2
  google_fonts: ^6.3.2
  percent_indicator: ^4.2.5
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
